[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "akili-runtime"
version = "0.1.0rc4"
description = "Versioned lifecycle, validation, budget and audit primitives for learned capabilities"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache License 2.0"}
authors = [{name = "Irénée Akilimali", email = "shukranimungu@gmail.com"}]
keywords = ["continual-learning", "edge-ai", "llm", "adapters", "model-governance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
]

[project.scripts]
akili = "akili_runtime.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
